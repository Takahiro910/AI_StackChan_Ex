; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
default_envs = m5stack-core2aws-realtime

[sd-updater]
build_flags = 
	-DENABLE_SD_UPDATER
lib_deps = 
	tobozo/M5Stack-SD-Updater
	https://github.com/tobozo/ESP32-targz

[llm_module]
build_flags = 
	-DUSE_LLM_MODULE
lib_deps = 
	https://github.com/m5stack/M5Module-LLM.git
	;https://github.com/m5stack/M5Module-LLM.git#dev

[realtime_api]
build_flags = 
	-DREALTIME_API
	;-DREALTIME_API_WITH_TTS			;Realtime APIの出力をテキストにして、VOICEVOXなどのTTSで発話する
	-DARDUINOJSON_STRING_LENGTH_SIZE=4	;デフォルトの2(バイト)だと扱えるJSONの文字数が64KBまでとなるが、RealtimeAPIが返してくる音声データは64KBを超えることがあるため、サイズ上限を拡張
	;-DDEBUG_WEBSOCKETS					;WebSocketのデバッグログを有効化
	;-DDEBUG_ESP_PORT=Serial			;WebSocketのデバッグログの出力ポート
lib_deps = 
	;links2004/WebSockets@^2.6.1
	https://github.com/ronron-gh/arduinoWebSockets.git#fix/max_data_size

[aquestalk]
build_flags = 
	-DUSE_AQUESTALK
	-Llib/aquestalk/src/esp32s2/
	-laquestalk_s

[aquestalk-cores3]
build_flags = 
	-DUSE_AQUESTALK
	-Llib/aquestalk/src/esp32s3/
	-laquestalk_s

[sanotts-cores3]
build_flags =
	-DUSE_SANOTTS
	-DSANOTTS_BUFFERED_PLAYBACK
	;-DSANOTTS_PLAYBACK_SAMPLE_RATE=20000
	-DSAAN_INT8_ACT=1
	-DSAAN_PIE=1
	-DSAAN_KANJI=1
	-DLABEL_IDS_EXTERNAL_SCRATCH=1
extra_scripts =
	pre:build_scripts/platformio_sanotts_validate.py
	pre:scripts/platformio_model.py
	pre:scripts/platformio_dictionary.py

[env:m5stack-core2]
platform = espressif32@6.3.2
board = m5stack-core2
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
board_build.partitions = default_16MB.csv
board_build.filesystem = spiffs
monitor_filters = esp32_exception_decoder
build_flags = 
	-DBOARD_HAS_PSRAM
	-DUSE_SERVO
	-DENABLE_WAKEWORD
	-DARDUINOJSON_DEFAULT_NESTING_LIMIT=100
	;-DCORE_DEBUG_LEVEL=5		;Verbose
	;-DUSE_AUDIO_MODULE			; Audio Moduleで外部マイク、スピーカーを使う場合。lib_depsのModule-Audioの有効化も必要。
	;-DENABLE_TAP_DETECT		; 加速度センサによるダブルタップの検出

lib_deps = 
	m5stack/M5Unified @ 0.2.7
	m5stack/M5GFX @ 0.2.27
	earlephilhower/ESP8266Audio @ ^1.9.7
	bblanchon/ArduinoJson @ ^7
	ESP32WebServer
	https://github.com/MechaUma/SimpleVox
	FastLED/FastLED@^3.5.0
	https://github.com/ronron-gh/esp8266FTPServer
	esp32-camera
	tobozo/YAMLDuino@^1.4.2
	https://github.com/stack-chan/stackchan-arduino.git
	;m5stack/Module-Audio@^0.0.1
lib_ldf_mode = deep
lib_ignore = saanotts_core

[env:m5stack-core2-sdu]
extends = env:m5stack-core2, sd-updater
build_flags = ${env:m5stack-core2.build_flags} ${sd-updater.build_flags}
lib_deps = 
	${env:m5stack-core2.lib_deps} ${sd-updater.lib_deps}

[env:m5stack-core2-llm]
extends = env:m5stack-core2, llm_module
build_flags = ${env:m5stack-core2.build_flags} ${llm_module.build_flags}
lib_deps = 
	${env:m5stack-core2.lib_deps} ${llm_module.lib_deps}

[env:m5stack-core2-llm-aquestalk]
extends = env:m5stack-core2, llm_module, aquestalk
build_flags = ${env:m5stack-core2.build_flags} ${llm_module.build_flags} ${aquestalk.build_flags}
lib_deps = 
	${env:m5stack-core2.lib_deps} ${llm_module.lib_deps}

[env:m5stack-core2-realtime]
extends = env:m5stack-core2, realtime_api
build_flags = ${env:m5stack-core2.build_flags} ${realtime_api.build_flags}
lib_deps = 
	${env:m5stack-core2.lib_deps} ${realtime_api.lib_deps}

[env:m5stack-core2aws-realtime]
; M5Stack Core2 for AWS（足＝サーボなし構成）向け。USE_SERVO を外し、サーボ駆動タスクと Port A (GPIO32/33) への PWM 出力を無効化。
; Core2 for AWS は 16MB Flash / 8MB PSRAM で、ピン配置は Core2 と同じ（M5Unified は Core2 として検出する）。
; Gemini Live の感情適応 (affective dialog) を試す場合は -DGEMINI_LIVE_AFFECTIVE_DIALOG を追加。
extends = env:m5stack-core2, realtime_api
build_flags = 
	-DBOARD_HAS_PSRAM
	-DENABLE_WAKEWORD
	-DARDUINOJSON_DEFAULT_NESTING_LIMIT=100
	${realtime_api.build_flags}
	;-DGEMINI_LIVE_AFFECTIVE_DIALOG	; Gemini 3.8 Live では API から削除済み（有効にすると音声送信時に 1007）
	-DUSE_LED_BAR			; Core2 for AWS の側面 LED バー（SK6812 x10）を会話状態・口パクに連動
	-DLED_BAR_PIN=25
	-DLED_BAR_NUM=10
	;-DLED_BAR_REVERSE	; LED の並びが左右逆に見える場合に有効化
	-DDIST_THRESHOLD=230	; ウェイクワード一致閾値（上流 250）。登録を 2〜3 回重ねてから 200 前後まで詰めると誤検出が減る
	;-DDEBUG_WEBSOCKETS			; 切断理由(クローズコード/理由文)を見たいときに有効化。ハンドシェイクのAPIキーもシリアルに出るので常用しない
	;-DDEBUG_ESP_PORT=Serial
lib_deps = 
	${env:m5stack-core2.lib_deps} ${realtime_api.lib_deps}

[env:m5stack-core2-realtime-aquestalk]
extends = env:m5stack-core2, realtime_api, aquestalk
build_flags = ${env:m5stack-core2.build_flags} ${realtime_api.build_flags} ${aquestalk.build_flags}
lib_deps = 
	${env:m5stack-core2.lib_deps} ${realtime_api.lib_deps}

[env:m5stack-cores3]
platform = espressif32@6.3.2
;platform = espressif32@6.11.0
board = esp32s3box
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_build.arduino.partitions = my_cores3_16MB.csv
monitor_filters = esp32_exception_decoder
board_build.f_flash = 80000000L
board_build.filesystem = spiffs
build_flags = 
	-DBOARD_HAS_PSRAM
	-DUSE_SERVO
	-DARDUINO_M5STACK_CORES3
	-DENABLE_WAKEWORD
	-DARDUINOJSON_DEFAULT_NESTING_LIMIT=100
	;-DENABLE_TAP_DETECT		; 加速度センサによるダブルタップの検出 (※CoreS3-SEは加速度センサ非搭載)
monitor_speed = 115200
upload_speed = 1500000
lib_deps = 
	m5stack/M5Unified @ 0.2.15		; Add support StackChan board
	m5stack/M5GFX @ 0.2.27
	earlephilhower/ESP8266Audio @ ^1.9.7
	bblanchon/ArduinoJson @ ^7
	ESP32WebServer
	https://github.com/MechaUma/SimpleVox
	FastLED/FastLED@^3.5.0
	https://github.com/ronron-gh/esp8266FTPServer
	esp32-camera
	tobozo/YAMLDuino@^1.4.2
	https://github.com/stack-chan/stackchan-arduino.git
lib_ldf_mode = deep
lib_ignore = saanotts_core

[env:m5stack-cores3-aquestalk]
extends = env:m5stack-cores3, aquestalk-cores3
build_flags = ${env:m5stack-cores3.build_flags} ${aquestalk-cores3.build_flags}
lib_deps = 
	${env:m5stack-cores3.lib_deps} 

[env:m5stack-cores3-sanotts]
extends = env:m5stack-cores3, sanotts-cores3
build_flags = ${env:m5stack-cores3.build_flags} ${sanotts-cores3.build_flags}
extra_scripts = ${sanotts-cores3.extra_scripts}
lib_ignore =
lib_deps =
	${env:m5stack-cores3.lib_deps}

[env:m5stack-cores3-llm]
extends = env:m5stack-cores3, llm_module
build_flags = ${env:m5stack-cores3.build_flags} ${llm_module.build_flags}
lib_deps = 
	${env:m5stack-cores3.lib_deps} ${llm_module.lib_deps}

[env:m5stack-cores3-llm-aquestalk]
extends = env:m5stack-cores3, llm_module, aquestalk-cores3
build_flags = ${env:m5stack-cores3.build_flags} ${llm_module.build_flags} ${aquestalk-cores3.build_flags}
lib_deps = 
	${env:m5stack-cores3.lib_deps} ${llm_module.lib_deps}

[env:m5stack-cores3-realtime]
extends = env:m5stack-cores3, realtime_api
build_flags = ${env:m5stack-cores3.build_flags} ${realtime_api.build_flags}
lib_deps = 
	${env:m5stack-cores3.lib_deps} ${realtime_api.lib_deps}

[env:m5stack-cores3-realtime-aquestalk]
extends = env:m5stack-cores3, realtime_api, aquestalk-cores3
build_flags = ${env:m5stack-cores3.build_flags}
              ${realtime_api.build_flags}
			  ${aquestalk-cores3.build_flags}
              -DREALTIME_API_WITH_TTS
lib_deps = 
	${env:m5stack-cores3.lib_deps} ${realtime_api.lib_deps}

[env:m5stack-cores3-realtime-sanotts]
extends = env:m5stack-cores3, realtime_api, sanotts-cores3
build_flags = ${env:m5stack-cores3.build_flags}
              ${realtime_api.build_flags}
			  ${sanotts-cores3.build_flags}
              -DREALTIME_API_WITH_TTS
extra_scripts = ${sanotts-cores3.extra_scripts}
lib_ignore = 
lib_deps = 
	${env:m5stack-cores3.lib_deps} ${realtime_api.lib_deps}


[env:m5stack-atoms3r]
platform    = espressif32@6.11.0
board       = m5stack-atoms3
framework   = arduino

; ファイルシステム
;board_build.filesystem = littlefs
board_build.filesystem = spiffs

; PSRAM 有効化
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type          = opi

monitor_speed = 115200
;monitor_filters = esp32_exception_decoder		// シリアルモニタに何も出なくなった

build_flags =
	-DESP32S3
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DARDUINO_USB_CDC_ON_BOOT=1      ; USB CDC を起動時から有効化
	-DARDUINO_USB_MODE=1             ; USB シリアルポートを使う
	-DARDUINO_M5STACK_ATOMS3R
	;-DENABLE_WAKEWORD               ; ウェイクワードは未対応
	-DARDUINOJSON_DEFAULT_NESTING_LIMIT=100
	;-DCAT_FACE
	;-DENABLE_TAP_DETECT			 ; 加速度センサによるダブルタップの検出

lib_deps =
	m5stack/M5Unified @ 0.2.7
	m5stack/M5GFX @ 0.2.27
	earlephilhower/ESP8266Audio @ ^1.9.7
	bblanchon/ArduinoJson @ ^7
	ESP32WebServer
	;https://github.com/MechaUma/SimpleVox    ; ウェイクワードは未対応
	FastLED/FastLED@^3.5.0
	https://github.com/ronron-gh/esp8266FTPServer
	esp32-camera
	tobozo/YAMLDuino@^1.4.2
	https://github.com/stack-chan/stackchan-arduino.git
lib_ldf_mode = deep
lib_ignore = saanotts_core

[env:m5stack-atoms3r-realtime]
extends = env:m5stack-atoms3r, realtime_api
build_flags = ${env:m5stack-atoms3r.build_flags} ${realtime_api.build_flags}
lib_deps = 
	${env:m5stack-atoms3r.lib_deps} ${realtime_api.lib_deps}
